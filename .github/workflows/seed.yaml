name: seed

on:
  push:
    branches:
      - master
    paths:
      - flake.lock
      - .github/workflows/seed.yaml
  workflow_dispatch:

jobs:
  seed:
    permissions:
      contents: write
      id-token: write
      packages: write
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: roundtablelove/nix-seed/seed@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
